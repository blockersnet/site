<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mnyilinga Hub UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brand-blue: #00AEEF;
            --brand-dark-blue: #003768;
            --brand-muted-blue: #145882;
            --bg-dark: #0A0D15;
            --bg-darker: #05070C;
            --text-light: #FFFFFF;
            --text-muted: #8E9BB0;
            --badge-red: #D5122A;
            --border-color: #171E2D;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #222;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 414px; /* Standard mobile width */
            background-color: var(--bg-dark);
            position: relative;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- Header Section --- */
        .header-wrapper {
            background-color: var(--brand-blue);
            width: 100%;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
        }

        .logo-container {
            display: flex;
            align-items: center;
        }

        .logo-container img {
            height: 32px;
            width: auto;
        }

        .header-actions {
            display: flex;
            gap: 20px;
            color: var(--brand-dark-blue);
            font-size: 20px;
        }

        .header-actions i {
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .header-actions i:hover {
            opacity: 0.7;
        }

        /* --- Sub Navigation --- */
        .sub-nav {
            display: flex;
            gap: 16px;
            padding: 0 20px 16px 20px;
            align-items: center;
            overflow-x: auto;
            white-space: nowrap;
        }

        .sub-nav::-webkit-scrollbar {
            display: none;
        }

        .sub-nav .label {
            color: var(--brand-muted-blue);
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .sub-nav a {
            color: var(--brand-dark-blue);
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            transition: opacity 0.2s;
        }

        .sub-nav a:hover {
            opacity: 0.8;
        }

        /* --- Language Bar --- */
        .language-bar {
            background-color: var(--bg-darker);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .language-bar p {
            color: #C1C6CF;
            font-size: 13px;
            font-weight: 400;
        }

        .lang-btn {
            background: transparent;
            border: 1.5px solid var(--text-light);
            color: var(--text-light);
            border-radius: 4px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .lang-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .lang-btn i {
            font-size: 14px;
        }

        /* --- Hero Article --- */
        .hero-article {
            position: relative;
            height: 420px;
            background: url('https://images.unsplash.com/photo-1596484552834-6a58f850e0a1?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            cursor: pointer;
        }

        .hero-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65%;
            background: linear-gradient(to top, #0C101A 0%, rgba(12, 16, 26, 0.9) 25%, rgba(12, 16, 26, 0.4) 60%, transparent 100%);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            padding: 20px;
        }

        .hero-title {
            color: var(--text-light);
            font-size: 26px;
            font-weight: 700;
            line-height: 1.25;
            margin-bottom: 12px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .hero-meta {
            color: #92A0B5;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .hero-meta span {
            color: #586982;
            margin: 0 4px;
        }

        /* --- News List Section --- */
        .news-section {
            background-color: var(--bg-dark);
            flex: 1;
        }

        .news-item {
            display: flex;
            align-items: center;
            padding: 20px;
            gap: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .news-item:hover {
            background-color: rgba(255, 255, 255, 0.03);
        }

        .news-thumbnail {
            width: 75px;
            height: 75px;
            object-fit: cover;
            border-radius: 2px;
            flex-shrink: 0;
        }

        .news-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .badge {
            background-color: var(--badge-red);
            color: var(--text-light);
            font-size: 10px;
            font-weight: 700;
            padding: 3px 6px;
            border-radius: 2px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .news-title {
            color: var(--text-light);
            font-size: 16px;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 8px;
        }

        .news-meta {
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .news-meta span {
            color: #4A5668;
            margin: 0 4px;
        }

        .news-action {
            color: var(--text-light);
            font-size: 18px;
            padding-left: 10px;
        }

        /* --- Pagination Indicators --- */
        .pagination {
            display: flex;
            gap: 4px;
            padding: 0 20px 24px 20px;
            justify-content: center;
            align-items: center;
        }

        .page-line {
            height: 2px;
            background-color: rgba(255, 255, 255, 0.2);
            flex: 1;
            max-width: 60px;
            border-radius: 2px;
        }

        .page-line.active {
            background-color: var(--text-light);
        }

        /* Responsive adjustments */
        @media (max-width: 414px) {
            body {
                background-color: var(--bg-dark);
            }
            .app-container {
                box-shadow: none;
                height: 100vh;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <header class="header-wrapper">
            <div class="top-bar">
                <div class="logo-container">
                    <img src="https://cdn.mnyilinga.co.tz/HUB-WHITE-01.svg" alt="MNYILINGA HUB">
                </div>
                <div class="header-actions">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <i class="fa-solid fa-bars"></i>
                </div>
            </div>
            
            <nav class="sub-nav">
                <span class="label">IN FOCUS</span>
                <a href="#">Iran</a>
                <a href="#">Ukraine</a>
                <a href="#">Hungary</a>
            </nav>
        </header>

        <div class="language-bar">
            <p>We have chosen English for you.</p>
            <button class="lang-btn">
                <i class="fa-solid fa-globe"></i> Change language
            </button>
        </div>

        <main>
            <article class="hero-article">
                <div class="hero-overlay"></div>
                <div class="hero-content">
                    <h1 class="hero-title">Europe looks to secure shipping in Strait of Hormuz</h1>
                    <div class="hero-meta">
                        POLITICS <span>|</span> 14 hours ago
                    </div>
                </div>
            </article>

            <section class="news-section">
                <article class="news-item">
                    <img src="https://images.unsplash.com/photo-1596394883488-8b939f15049a?auto=format&fit=crop&w=150&q=80" alt="News Thumbnail" class="news-thumbnail">
                    <div class="news-details">
                        <span class="badge">NEW</span>
                        <h2 class="news-title">Iran closes Strait of Hormuz again over US blockade</h2>
                        <div class="news-meta">
                            CONFLICTS <span>|</span> 46 minutes ago
                        </div>
                    </div>
                    <div class="news-action">
                        <i class="fa-solid fa-chevron-right"></i>
                    </div>
                </article>

                <div class="pagination">
                    <div class="page-line active"></div>
                    <div class="page-line"></div>
                    <div class="page-line"></div>
                </div>
            </section>
        </main>

    </div>

</body>
</html>
